<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 编辑台 · Aoraku</title><link rel="stylesheet" href="/editor/editor.css"><script defer src="/editor/editor.js"></script></head>
<body><header><div><a href="http://127.0.0.1:8765/blog" target="_blank" rel="noopener">Aoraku ↗</a><h1>Blog 编辑台</h1></div><span>本机保存 · 发布前可预览</span></header>
<main><aside><label for="search">文章</label><input id="search" type="search" placeholder="搜索标题、标签或编号"><select id="filter" aria-label="筛选分类"><option value="">全部分类</option></select><label class="check"><input id="issues-only" type="checkbox">只看结构待核对</label><p id="count"></p><nav id="articles" aria-label="文章列表"></nav></aside>
<section class="workspace"><form id="metadata"><div class="form-top"><div><p id="article-id"></p><a id="preview-link" target="_blank" rel="noopener">打开文章 ↗</a></div><div><button id="reset" type="button" class="secondary">撤销未保存修改</button><button id="save" type="submit">保存</button></div></div><p id="status" role="status" aria-live="polite">正在加载…</p>
<label for="title">标题</label><input id="title" name="title" required maxlength="500">
<div class="pair"><div><label for="date">日期</label><input id="date" name="date" type="date" required></div><label class="check feature"><input id="selected" name="selected" type="checkbox">加入精选</label></div>
<fieldset><legend>分类 <small>至少选择一项；精选独立于分类</small></legend><div id="categories"></div></fieldset>
<label for="tags">标签 <small>用逗号分隔</small></label><input id="tags" name="tags">
<label for="summary">推介语</label><textarea id="summary" name="summary" rows="5" maxlength="10000"></textarea>
<details id="audit"><summary>文章结构检查</summary><p id="audit-status"></p><p id="audit-note"></p><p id="audit-heading"></p><p class="source" id="source"></p></details>
<section class="preview" aria-label="列表卡片预览"><p class="caption">列表预览</p><p id="preview-meta"></p><h2 id="preview-title"></h2><p id="preview-summary"></p><p id="preview-tags"></p></section>
<p class="hint">保存会更新仓库中的文章元数据与索引，并保留本机备份。正文不受影响。⌘ / Ctrl + S 保存。</p></form></section></main></body></html>
